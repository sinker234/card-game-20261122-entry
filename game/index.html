<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Court — a lane-battle card duel</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">▲ EMBER COURT</div>
    <div class="topstats">
      <span id="turn-label">Turn 1</span>
      <span id="mana-label" class="mana">Mana 0</span>
      <span id="score-label">Score 0</span>
      <button id="help-btn" type="button" title="How to play (H)">?</button>
      <button id="mute-btn" type="button" title="Sound on/off (M)">♪</button>
    </div>
  </header>

  <section id="foe-row" aria-label="Opponent">
    <div class="combatant foe">
      <div class="portrait foe-portrait">R</div>
      <div class="combatant-info">
        <div class="combatant-name">Rook, the Clockwork Duchess</div>
        <div class="life-bar"><div id="foe-life-fill" class="life-fill foe-fill"></div><span id="foe-life-text" class="life-text">30 HP</span></div>
        <div id="foe-hand-label" class="hand-count">Hand: 4 cards</div>
      </div>
      <div id="foe-intent" class="intent">Rook is studying the table…</div>
    </div>
  </section>

  <main id="lanes" aria-label="Battle lanes"></main>

  <section id="log-row"><div id="battle-log" aria-live="polite"></div></section>

  <section id="player-row" aria-label="Your hand">
    <div class="combatant you">
      <div class="portrait you-portrait">E</div>
      <div class="combatant-info">
        <div class="combatant-name">You — the Ember Envoy</div>
        <div class="life-bar"><div id="you-life-fill" class="life-fill you-fill"></div><span id="you-life-text" class="life-text">30 HP</span></div>
        <div id="deck-label" class="hand-count">Deck: 32 cards</div>
      </div>
      <button id="end-turn-btn" type="button">End Turn (E)</button>
    </div>
    <div id="hand" aria-label="Your hand"></div>
    <div id="hint">Click a card, then click a lane. Keys: ← → pick a card · ↑ ↓ pick a lane · Enter play · E end turn · R restart</div>
  </section>

  <div id="overlay" class="hidden"></div>
  <div id="toast" class="hidden"></div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
